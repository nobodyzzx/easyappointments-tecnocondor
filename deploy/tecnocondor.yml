services:
  php-fpm:
    build:
      context: ..
      dockerfile: docker/php-fpm/Dockerfile
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    working_dir: /var/www/html
    environment:
      - BASE_URL=https://${DOMAIN}
      - DB_HOST=mysql
      - DB_NAME=${MYSQL_DATABASE}
      - DB_USERNAME=${MYSQL_USER}
      - DB_PASSWORD=${MYSQL_PASSWORD}
      - PHP_TZ=America/La_Paz
      - TZ=America/La_Paz
    volumes:
      - ..:/var/www/html
      - ../docker/php-fpm/php-ini-overrides.ini:/usr/local/etc/php/conf.d/99-overrides.ini
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - dokploy-network
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

  nginx:
    image: nginx:1.23.3-alpine
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 32M
    working_dir: /var/www/html
    environment:
      - TZ=America/La_Paz
    volumes:
      - ..:/var/www/html
      - ../docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php-fpm
    networks:
      - dokploy-network
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - TZ=America/La_Paz
    volumes:
      - /home/nobodyzz/backups_tecnocondor/easyappointments/mysql:/var/lib/mysql
    networks:
      - dokploy-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

networks:
  dokploy-network:
    external: true
